
name: Seamless Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Seamless APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android project directory
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "Seamless-Android/settings.gradle.kts" ]; then
            PROJECT_DIR="Seamless-Android"
          else
            echo "ERROR: Could not find settings.gradle.kts"
            ls -la
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project in: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Seamless APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.project_dir }}" \
            :app:assembleDebug

      - name: Upload Seamless APK
        uses: actions/upload-artifact@v4
        with:
          name: Seamless-Android-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
