
name: Seamless Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Seamless APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f "Seamless-Android/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/Seamless-Android"
          elif [ -f "Seamless-Android-GitHub.zip" ]; then
            mkdir -p extracted-project
            unzip -q Seamless-Android-GitHub.zip -d extracted-project

            SETTINGS_FILE=$(find extracted-project -name settings.gradle.kts -print -quit)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle.kts was not found inside the ZIP."
              find extracted-project -maxdepth 4 -type f | head -100
              exit 1
            fi

            PROJECT_DIR="$(dirname "$GITHUB_WORKSPACE/$SETTINGS_FILE")"
          else
            echo "ERROR: Android project ZIP not found."
            ls -la
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Seamless APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.project_dir }}" \
            :app:assembleDebug

      - name: Upload Seamless APK
        uses: actions/upload-artifact@v4
        with:
          name: Seamless-Android-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
